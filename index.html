<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }

        /* 화면 분할 레이아웃 (왼쪽: 사이드바, 오른쪽: 지도) */
        .container { display: flex; width: 100%; height: 100vh; }

        /* 사이드바 스타일 */
        #sidebar {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 10;
        }

        /* 검색창 영역 */
        .search-box { padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        .search-box input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-box button {
            width: 15%;
            padding: 10px;
            background: #fee500; /* 카카오 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 검색 결과 리스트 영역 */
        #placesList { flex: 1; overflow-y: auto; padding: 10px; }
        .place-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: #fff;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .place-item:hover { background: #f0f0f0; }
        .place-item h5 { color: #333; margin-bottom: 5px; }
        .place-item p { font-size: 13px; color: #666; }

        /* 지도 영역 */
        #map { flex: 1; height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <div class="search-box">
            <input type="text" id="keyword" placeholder="장소를 입력하세요 (예: 강남역)" onkeypress="if(event.keyCode==13) searchPlaces()">
            <button onclick="searchPlaces()">🔍</button>
        </div>
        <div id="placesList">
            <p style="text-align: center; color: #999; margin-top: 20px;">검색 결과가 여기에 표시됩니다.</p>
        </div>
    </div>

    <div id="map"></div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=891c7de69800b4faa1fc5533947983f5&libraries=services,clusterer,drawing&autoload=false"></script>

<script>
    let map; // 지도 객체
    let ps; // 장소 검색 객체
    let infowindow; // 클릭했을 때 나타나는 정보창
    let markers = []; // 지도에 표시된 마커 관리 배열

    // 1. SDK 로드 후 지도 초기화 시작
    kakao.maps.load(function() {
        const mapContainer = document.getElementById('map');
        const mapOptions = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 위치 (서울시청)
            level: 5 // 확대 레벨 설정
        };

        // 지도 생성
        map = new kakao.maps.Map(mapContainer, mapOptions);
        
        // 장소 검색 객체 및 정보창 생성
        ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        // 2. 현재 위치 가져오기 (Geolocation)
        getCurrentLocation();
    });

    // 현재 위치를 받아와서 지도의 중심을 옮기는 함수
    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude; // 위도
                const lon = position.coords.longitude; // 경도
                const locPosition = new kakao.maps.LatLng(lat, lon);

                map.setCenter(locPosition); // 지도의 중심을 현재 위치로 이동
                
                // 현재 위치에 마커 하나 표시 (선택사항)
                const marker = new kakao.maps.Marker({
                    position: locPosition,
                    map: map
                });
            }, function(error) {
                console.error("위치 정보를 가져오는데 실패했습니다.", error);
            });
        }
    }

    // 키워드로 장소 검색 실행 함수
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('키워드를 입력해주세요!');
            return;
        }

        // 카카오 검색 서비스 이용
        ps.keywordSearch(keyword, placesSearchCB);
    }

    // 장소 검색 완료 시 호출되는 콜백 함수
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data); // 검색 결과 목록과 마커 표시
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과 리스트와 마커를 화면에 그리는 함수
    function displayPlaces(places) {
        const listEl = document.getElementById('placesList');
        const bounds = new kakao.maps.LatLngBounds();
        
        removeMarkers(); // 기존 마커 제거
        listEl.innerHTML = ''; // 기존 리스트 초기화

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            const marker = addMarker(placePosition); // 마커 생성
            const itemEl = getListItem(i, places[i]); // 리스트 아이템 생성

            // 검색된 장소 위치를 포함하도록 지도 범위 확장
            bounds.extend(placePosition);

            // 마커와 리스트 아이템에 마우스 이벤트 등록 (클릭 시 이름 표시)
            (function(marker, title) {
                kakao.maps.event.addListener(marker, 'click', function() {
                    displayInfowindow(marker, title);
                });

                itemEl.onclick = function() {
                    displayInfowindow(marker, title);
                    map.panTo(marker.getPosition()); // 해당 위치로 지도 부드럽게 이동
                };
            })(marker, places[i].place_name);

            listEl.appendChild(itemEl);
        }

        // 검색된 장소들이 다 보이도록 지도 범위 조정
        map.setBounds(bounds);
    }

    // 리스트 아이템 HTML 생성 함수
    function getListItem(index, places) {
        const el = document.createElement('div');
        el.className = 'place-item';
        el.innerHTML = `
            <h5>${places.place_name}</h5>
            <p>${places.road_address_name || places.address_name}</p>
            <span style="color: #007bff; font-size: 12px;">${places.phone}</span>
        `;
        return el;
    }

    // 마커 생성 함수
    function addMarker(position) {
        const marker = new kakao.maps.Marker({
            position: position,
            map: map
        });
        markers.push(marker);
        return marker;
    }

    // 지도 위 기존 마커 삭제 함수
    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    // 정보창 표시 함수
    function displayInfowindow(marker, title) {
        const content = `<div style="padding:5px;z-index:1;font-size:12px;">${title}</div>`;
        infowindow.setContent(content);
        infowindow.open(map, marker);
    }
</script>

</body>
</html>
