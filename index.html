<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘, 어디서 쉴까? - 휴식 공간 찾기</title>
    <style>
        /* 기본 스타일 초기화 및 따뜻한 아이보리 베이스 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; background-color: #faf7f2; color: #5c4f43; }

        /* 화면 분할 레이아웃 (왼쪽: 사이드바, 오른쪽: 지도) */
        .container { display: flex; width: 100%; height: 100vh; position: relative; }

        /* 사이드바 스타일 */
        #sidebar {
            width: 360px;
            height: 100%;
            background: #fdfbf9;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e6dfd5;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(92, 79, 67, 0.05);
        }

        /* 기준 위치 검색 영역 */
        .base-location-box { padding: 18px 20px 12px 20px; background: #fff; border-bottom: 1px solid #f2ede4; }
        .base-location-box label { font-size: 12px; font-weight: bold; color: #a19283; display: block; margin-bottom: 6px; }
        .input-group { display: flex; gap: 6px; }
        .input-group input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e6dfd5;
            border-radius: 8px;
            font-size: 13px;
            background-color: #faf7f2;
            outline: none;
            color: #5c4f43;
        }
        .input-group input::placeholder { color: #c2b7ac; }
        .input-group button {
            padding: 0 14px;
            background: #ebdccb;
            color: #5c4f43;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .input-group button:hover { background: #dfcebc; }

        /* 메인 카테고리 탭 메뉴 */
        .tab-menu { display: flex; background: #f2ede4; padding: 4px; margin: 12px 20px 6px 20px; border-radius: 10px; }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #8c7f70;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active { background: #fff; color: #d47a55; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        /* 세부 장소 선택 및 검색 영역 */
        .search-box { padding: 8px 20px 12px 20px; display: flex; gap: 6px; }
        .search-box select {
            flex: 1;
            padding: 11px;
            border: 1px solid #e6dfd5;
            border-radius: 8px;
            font-size: 13px;
            background-color: #fff;
            color: #5c4f43;
            outline: none;
        }
        .search-box button {
            width: 45px;
            background: #ffe6d5; /* 부드러운 오렌지 파스텔 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .search-box button:hover { background: #ffd4ba; }

        /* 스크롤 가능한 리스트 컨테이너 */
        .list-container { flex: 1; overflow-y: auto; padding: 10px 20px; }
        .list-container::-webkit-scrollbar { width: 5px; }
        .list-container::-webkit-scrollbar-thumb { background: #e6dfd5; border-radius: 10px; }

        /* 장소 정보 카드 스타일 */
        .place-item {
            padding: 16px;
            border: 1px solid #f2ede4;
            background: #fff;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(92, 79, 67, 0.02);
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
        }
        .place-item:hover { transform: translateY(-1px); border-color: #ffd4ba; background-color: #fffdfa; }
        .place-item h5 { color: #40362d; margin-bottom: 6px; font-size: 15px; font-weight: bold; }
        .place-item p { font-size: 12px; color: #8c7f70; margin-bottom: 4px; line-height: 1.4; }
        .place-item .phone { color: #db8a5c; font-size: 11px; font-weight: bold; display: block; }
        .place-item .hours { font-size: 11px; color: #b5a99c; margin-top: 6px; }

        /* 지도 영역 */
        #map { flex: 1; height: 100%; background-color: #f4f1ea; position: relative; }

        /* ── [신규 추가] 지도 위 부유하는 감성 타이틀 바 스타일 ── */
        .floating-title {
            position: absolute;
            top: 16px;
            left: 376px; /* 사이드바(360px) + 여백(16px) */
            z-index: 15;
            background: rgba(255, 255, 255, 0.88);
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(92, 79, 67, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid #ebdccb;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .floating-title span { font-size: 16px; }
        .floating-title h2 { font-size: 14px; font-weight: bold; color: #5c4f43; margin: 0; letter-spacing: -0.5px; }

        /* ── [오류 수정] CSS 기반 파스텔톤 커스텀 마커 스타일 ── */
        .custom-pin {
            width: 28px;
            height: 28px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: -2px 2px 4px rgba(0,0,0,0.15);
            border: 2px solid #ffffff;
            cursor: pointer;
        }
        /* 기준점(내위치/검색지)을 위한 펄스 마커 스타일 */
        .base-pin {
            width: 16px;
            height: 16px;
            background-color: #d47a55;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(212, 122, 85, 0.6);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <div class="base-location-box">
            <label for="baseAddress">📍 어디 주변의 휴식 공간을 찾을까요?</label>
            <div class="input-group">
                <input type="text" id="baseAddress" placeholder="예: 강남역, 정발산동 (비우면 내 위치)" onkeypress="if(event.keyCode==13) setBaseLocation()">
                <button onclick="setBaseLocation()">설정</button>
            </div>
        </div>

        <div class="tab-menu">
            <button id="tabNature" class="tab-btn active" onclick="switchTab('nature')">🌿 자연 휴식</button>
            <button id="tabHumanities" class="tab-btn" onclick="switchTab('humanities')">🏛️ 인문 휴식</button>
            <button id="tabHistory" class="tab-btn" onclick="switchTab('history')">🤎 내가 본 곳</button>
        </div>

        <div class="search-box" id="searchBoxWrapper">
            <select id="placeType">
                </select>
            <button onclick="searchPlaces()">🔍</button>
        </div>

        <div id="placesList" class="list-container">
            <p style="text-align: center; color: #b5a99c; margin-top: 40px; font-size: 13px;">상단의 세부 카테고리를 선택해 검색해보세요!</p>
        </div>

        <div id="historyList" class="list-container" style="display: none;">
            <p style="text-align: center; color: #b5a99c; margin-top: 40px; font-size: 13px;">아직 살펴본 장소가 없습니다.</p>
        </div>
    </div>

    <div id="map">
        <div class="floating-title">
            <span>🍃</span>
            <h2>오늘, 어디서 쉴까?</h2>
        </div>
    </div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=891c7de69800b4faa1fc5533947983f5&libraries=services,clusterer&autoload=false"></script>

<script>
    let map; // 지도 객체
    let ps; // 장소 검색 객체
    let infowindow; // 정보창 객체
    let clusterer; // 마커 클러스터러 객체
    let overlays = []; // CustomOverlay 마커들을 저장할 배열
    let baseLocationOverlay = null; // 기준점 커스텀 오버레이
    let currentTab = 'nature'; // 현재 활성화된 탭 상태
    let searchHistory = JSON.parse(localStorage.getItem('restSpaceHistory')) || []; // 검색 기록 데이터

    // 감성 테마별 마커 색상 정의 (CSS 결합용 헥사코드)
    const markerColors = {
        '산': '#7fa99b',     // 세이지 그린
        '공원': '#a2b997',   // 소프트 연두
        '호수': '#92b4ec',   // 파스텔 스카이 블루
        '강': '#5ea3a3',     // 차분한 오션 블루
        '도서관': '#e0b094', // 따뜻한 살구 베이지
        '미술관': '#e4bad4', // 은은한 파스텔 핑크
        '박물관': '#c6a49a'  // 소프트 브라운
    };

    // 1. 카카오맵 지도 초기화
    kakao.maps.load(function() {
        const mapContainer = document.getElementById('map');
        const mapOptions = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 서울시청 기본
            level: 5
        };

        map = new kakao.maps.Map(mapContainer, mapOptions);
        ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 3 });

        // 클러스터러 디자인 커스텀
        clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 6,
            styles: [{
                width: '40px', height: '40px',
                background: 'rgba(235, 220, 203, 0.95)',
                borderRadius: '50%',
                color: '#5c4f43',
                textAlign: 'center',
                fontWeight: 'bold',
                lineHeight: '40px',
                boxShadow: '0 2px 8px rgba(0,0,0,0.1)'
            }]
        });

        updateSelectOptions('nature');
        getCurrentLocation();
        renderHistoryList();
    });

    // GPS 기반 현재 위치 불러오기
    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locPosition = new kakao.maps.LatLng(lat, lon);
                map.setCenter(locPosition);
                createBaseMarker(locPosition);
            });
        }
    }

    // 자율적 주소 설정을 통한 중심점 이동
    function setBaseLocation() {
        const address = document.getElementById('baseAddress').value;
        
        if (!address.trim()) {
            getCurrentLocation();
            return;
        }

        ps.keywordSearch(address, function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                const searchCenter = new kakao.maps.LatLng(data[0].y, data[0].x);
                map.setCenter(searchCenter);
                createBaseMarker(searchCenter);
                
                if (currentTab !== 'history') {
                    searchPlaces();
                }
            } else {
                alert('주소를 정확하게 찾을 수 없습니다. 다시 입력해 주세요!');
            }
        });
    }

    // 기준점 마커 생성 (CustomOverlay 활용 부그 예방)
    function createBaseMarker(position) {
        if (baseLocationOverlay) baseLocationOverlay.setMap(null);

        const content = document.createElement('div');
        content.className = 'base-pin';

        baseLocationOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: content,
            yAnchor: 0.5
        });
        baseLocationOverlay.setMap(map);
    }

    // 탭 전환 제어 시스템
    function switchTab(tabName) {
        currentTab = tabName;
        const resultsList = document.getElementById('placesList');
        const historyList = document.getElementById('historyList');
        const searchBoxWrapper = document.getElementById('searchBoxWrapper');
        
        document.getElementById('tabNature').classList.remove('active');
        document.getElementById('tabHumanities').classList.remove('active');
        document.getElementById('tabHistory').classList.remove('active');

        if (tabName === 'history') {
            resultsList.style.display = 'none';
            searchBoxWrapper.style.display = 'none';
            historyList.style.display = 'block';
            document.getElementById('tabHistory').classList.add('active');
            renderHistoryList();
        } else {
            resultsList.style.display = 'block';
            searchBoxWrapper.style.display = 'flex';
            historyList.style.display = 'none';
            
            if (tabName === 'nature') {
                document.getElementById('tabNature').classList.add('active');
                updateSelectOptions('nature');
            } else {
                document.getElementById('tabHumanities').classList.add('active');
                updateSelectOptions('humanities');
            }
        }
    }

    // 드롭다운 세부 옵션 빌더
    function updateSelectOptions(type) {
        const selectBox = document.getElementById('placeType');
        if (type === 'nature') {
            selectBox.innerHTML = `
                <option value="산">⛰️ 포근한 산</option>
                <option value="공원">🌳 한적한 공원</option>
                <option value="호수">🏞️ 잔잔한 호수</option>
                <option value="강">🌊 시원한 강가</option>
            `;
        } else {
            selectBox.innerHTML = `
                <option value="도서관">📚 조용한 도서관</option>
                <option value="미술관">🎨 아늑한 미술관</option>
                <option value="박물관">🏛️ 깊이있는 박물관</option>
            `;
        }
    }

    // 주변 장소 키워드 탐색 함수
    function searchPlaces() {
        const selectedType = document.getElementById('placeType').value;
        const searchOptions = {
            location: map.getCenter(),
            radius: 5000,
            sort: kakao.maps.services.SortBy.DISTANCE
        };
        ps.keywordSearch(selectedType, placesSearchCB, searchOptions);
    }

    // 검색 결과 가공 및 광고 필터링 부
    function placesSearchCB(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            // 상업성 장소 필터링 버그 수정 반영
            const filteredPlaces = data.filter(function(place) {
                const category = place.category_name;
                const name = place.place_name;
                const commercialKeywords = ['음식점', '카페', '식당', '술집', '베이커리', '숙박', '펜션', '호텔', '마트', '상점', '쇼핑', '회사', '기업'];
                
                const isCommercial = commercialKeywords.some(keyword => category.includes(keyword) || name.includes(keyword));
                return !isCommercial;
            });

            if (filteredPlaces.length > 0) {
                displayPlaces(filteredPlaces);
            } else {
                alert('주변에 상업 매장을 제외한 순수 휴식 공간이 없습니다.');
            }
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('주변 5km 이내에 해당 공간이 존재하지 않습니다.');
        } else {
            alert('검색 중 시스템 오류가 발생했습니다.');
        }
    }

    // 정제된 휴식 공간 표출 렌더러
    function displayPlaces(places) {
        const listEl = document.getElementById('placesList');
        const bounds = new kakao.maps.LatLngBounds();
        const selectedKeyword = document.getElementById('placeType').value;
        
        clearMap();
        listEl.innerHTML = '';

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            const overlay = createCustomOverlayMarker(placePosition, selectedKeyword, places[i]);
            const itemEl = getListItem(places[i]);

            bounds.extend(placePosition);

            // 이벤트 캡처 스코프 바인딩
            (function(targetOverlay, placeData) {
                itemEl.onclick = function() {
                    displayInfowindow(targetOverlay, placeData);
                    map.panTo(targetOverlay.getPosition());
                    saveToHistory(placeData);
                };
            })(overlay, places[i]);

            listEl.appendChild(itemEl);
        }
        map.setBounds(bounds);
    }

    // ── [오류 수정 핵심] HTML CustomOverlay 기반 마커 팩토리 함수 ──
    function createCustomOverlayMarker(position, type, placeData) {
        const color = markerColors[type] || '#ff8b66';
        
        // CSS 클래스가 먹힌 예쁜 마커 돔 노드 직접 생성
        const content = document.createElement('div');
        content.className = 'custom-pin';
        content.style.backgroundColor = color;

        const customOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: content,
            /* 물방울 꼬리침 포인트 좌표 정밀 보정 */
            xAnchor: 0,
            yAnchor: 1 
        });

        // 마커 직접 클릭 시에도 상호작용하도록 이벤트 부착
        content.onclick = function() {
            displayInfowindow(customOverlay, placeData);
            saveToHistory(placeData);
        };

        customOverlay.setMap(map);
        overlays.push(customOverlay); // 추후 삭제용 배열 백업
        return customOverlay;
    }

    // 리스트 카드 UI 템플릿 생성기
    function getListItem(place) {
        const el = document.createElement('div');
        el.className = 'place-item';
        const phoneText = place.phone ? `📞 ${place.phone}` : '📞 번호 정보 미등록';
        
        el.innerHTML = `
            <h5>${place.place_name}</h5>
            <p>${place.road_address_name || place.address_name}</p>
            <span class="phone">${phoneText}</span>
            <p class="hours">🕒 상세 이용시간은 상세보기를 참고하세요</p>
        `;
        return el;
    }

    // 최근 본 장소 기록 보관 (Localstorage)
    function saveToHistory(place) {
        searchHistory = searchHistory.filter(item => item.id !== place.id);
        searchHistory.unshift(place);
        if (searchHistory.length > 20) searchHistory.pop();
        localStorage.setItem('restSpaceHistory', JSON.stringify(searchHistory));
    }

    // 기록 탭 렌더링 드로잉
    function renderHistoryList() {
        const historyListEl = document.getElementById('historyList');
        historyListEl.innerHTML = '';

        if (searchHistory.length === 0) {
            historyListEl.innerHTML = '<p style="text-align: center; color: #b5a99c; margin-top: 40px; font-size: 13px;">아직 살펴본 장소가 없습니다.</p>';
            return;
        }

        searchHistory.forEach(function(place) {
            const itemEl = getListItem(place);
            itemEl.onclick = function() {
                const moveLatLng = new kakao.maps.LatLng(place.y, place.x);
                map.panTo(moveLatLng);
                displayInfowindow(null, place);
            };
            historyListEl.appendChild(itemEl);
        });
    }

    // 따뜻한 감성 테마 팝업 오버레이창 오픈 함수
    function displayInfowindow(overlay, place) {
        const content = `
            <div style="padding:16px; min-width:260px; line-height:1.6; font-family:'Malgun Gothic',sans-serif; background:#fff;">
                <h5 style="margin:0 0 6px 0; font-size:15px; color:#40362d; font-weight:bold;">${place.place_name}</h5>
                <p style="margin:0 0 4px 0; color:#8c7f70; font-size:12px; line-height:1.4;">📍 ${place.road_address_name || place.address_name}</p>
                <p style="margin:0 0 12px 0; color:#db8a5c; font-size:12px; font-weight:bold;">📞 ${place.phone || '번호 정보 없음'}</p>
                <div style="text-align:right; margin-top:10px; border-top:1px solid #f2ede4; padding-top:10px;">
                    <a href="${place.place_url}" target="_blank" style="display:inline-block; background:#ffe6d5; color:#5c4f43; padding:5px 12px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:12px;">상세보기 ↗</a>
                </div>
            </div>
        `;
        
        infowindow.setContent(content);

        if (overlay) {
            // 오버레이 좌표 기반 정보창 정렬 오픈
            infowindow.open(map, overlay);
        } else {
            infowindow.setPosition(new kakao.maps.LatLng(place.y, place.x));
            infowindow.open(map);
        }
    }

    // 맵 리셋 청소 함수
    function clearMap() {
        clusterer.clear();
        for (let i = 0; i < overlays.length; i++) {
            overlays[i].setMap(null);
        }
        overlays = [];
        infowindow.close();
    }
</script>

</body>
</html>
